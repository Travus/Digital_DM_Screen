appId: dev.travus.dmscreen
productName: Digital DM Screen
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# No native modules — safe to cross-build Windows targets from Linux/Wine.
npmRebuild: false

linux:
  target:
    - AppImage
    - deb
  # Must be the icon *set*, not build/icon.png. Given a single png, electron-builder
  # ships exactly that one file, at its own size — 1024x1024, which the hicolor theme
  # does not define a directory for, so the desktop never finds it and the installed
  # app has no icon. build/icons holds the standard sizes, rendered from icon.svg.
  icon: build/icons
  category: Utility
  synopsis: A tiling digital DM screen for tabletop RPGs
  maintainer: contact@travus.dev

mac:
  # This Mac is Apple Silicon. Build it on a native arm64 macOS runner; macOS
  # bundles cannot be produced correctly by the Linux/Wine container.
  target:
    - target: dmg
      arch:
        - arm64
  # electron-builder's portable icon tool converts the committed 1024px PNG to
  # ICNS; do not rely on a host-generated, untracked binary asset here.
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: Digital-DM-Screen-${version}-${arch}.${ext}

win:
  target:
    - nsis
    - portable

# Artifact naming. `${productName}` is "Digital DM Screen", and GitHub replaces
# the spaces with dots when a release asset is uploaded, so every release needed
# the five files renaming by hand. The literal below is that name already
# hyphenated; keep it in step with productName if that ever changes.

# Named per target — a shared win.artifactName would label the portable build
# "setup" as well.
nsis:
  artifactName: Digital-DM-Screen-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Digital DM Screen

portable:
  artifactName: Digital-DM-Screen-${version}-${arch}-portable.${ext}

# AppImage carries no arch in its default name and the release table follows that;
# deb keeps one, because a .deb without an architecture is unusual.
appImage:
  artifactName: Digital-DM-Screen-${version}.${ext}

deb:
  artifactName: Digital-DM-Screen-${version}-${arch}.${ext}
  # Everything the installer screen shows before the package is unpacked comes from
  # the deb control file and nothing else, so this is the only place a longer
  # description can go. `deb.description` would work too — but it is also written
  # verbatim into the .desktop file's Comment key, which is a one-line tooltip, and
  # an explicit desktop.entry.Comment cannot rescue it (electron-builder overwrites
  # Comment after merging the entry, exactly as it does Categories). Passing
  # --description straight to fpm sets the control field alone; the flag appears
  # twice on the command line and the last one wins.
  #
  # The first line is the summary the installer shows in bold; the rest is one
  # paragraph, and one paragraph only. fpm turns a blank line into the ` .` the
  # control format uses for a paragraph break, and nothing between there and the
  # screen puts it back: apt hands the description over as written, PackageKit
  # passes it through, and GNOME Software prints it — so every break arrives as a
  # stray `.` on a line of its own. Lines wrap into a paragraph on their own, so
  # this is only about breaks. Keep it in step with
  # build/dev.travus.dmscreen.metainfo.xml, which is read by tools that do
  # understand paragraphs and keeps its own.
  fpm:
    - --description
    - |-
      A tiling digital DM screen for tabletop RPGs
      Split the window into as many panes as you like and give each one a module:
      initiative and party trackers, conditions and rules reference, dice, timers,
      counters, notes, random tables and a name generator. The whole arrangement
      saves to a .dmscreen file, panel settings and live contents included, so a
      screen set up for one campaign reopens exactly as it was left, or goes to a
      friend as a single file. Reference content is SRD-only; anything beyond it
      loads at runtime from a data pack.
    # AppStream metadata. Nothing reads it before installing, but it is what makes
    # the installed app a proper entry in GNOME Software rather than a bare package
    # name. Relative to the project root, which is where fpm is spawned.
    - build/dev.travus.dmscreen.metainfo.xml=/usr/share/metainfo/dev.travus.dmscreen.metainfo.xml
