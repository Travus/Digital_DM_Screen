appId: dev.travus.dmscreen
productName: Digital DM Screen
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# No native modules — safe to cross-build Windows targets from Linux/Wine.
npmRebuild: false

linux:
  target:
    - AppImage
    - deb
  # Must be the icon *set*, not build/icon.png. Given a single png, electron-builder
  # ships exactly that one file, at its own size — 1024x1024, which the hicolor theme
  # does not define a directory for, so the desktop never finds it and the installed
  # app has no icon. build/icons holds the standard sizes, rendered from icon.svg.
  icon: build/icons
  category: Utility
  synopsis: A tiling digital DM screen for tabletop RPGs
  maintainer: contact@travus.dev

mac:
  # This Mac is Apple Silicon. Build it on a native arm64 macOS runner; macOS
  # bundles cannot be produced correctly by the Linux/Wine container.
  target:
    - target: dmg
      arch:
        - arm64
  # electron-builder's portable icon tool converts the committed 1024px PNG to
  # ICNS; do not rely on a host-generated, untracked binary asset here.
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: Digital-DM-Screen-${version}-${arch}.${ext}

win:
  target:
    - nsis
    - portable

# Artifact naming. `${productName}` is "Digital DM Screen", and GitHub replaces
# the spaces with dots when a release asset is uploaded, so every release needed
# the five files renaming by hand. The literal below is that name already
# hyphenated; keep it in step with productName if that ever changes.

# Named per target — a shared win.artifactName would label the portable build
# "setup" as well.
nsis:
  artifactName: Digital-DM-Screen-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Digital DM Screen

portable:
  artifactName: Digital-DM-Screen-${version}-${arch}-portable.${ext}

# AppImage carries no arch in its default name and the release table follows that;
# deb keeps one, because a .deb without an architecture is unusual.
appImage:
  artifactName: Digital-DM-Screen-${version}.${ext}

deb:
  artifactName: Digital-DM-Screen-${version}-${arch}.${ext}
