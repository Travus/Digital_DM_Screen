# Proves the installers still build. Separate from ci.yml purely so the triggers
# can differ: only PRs that touch something packaging actually reads.
#
# The push:main half is not about re-testing — the ruleset requires a PR, so
# anything reaching main was built here minutes earlier. It exists to populate
# the cache. Actions caches are readable only from their own ref or the default
# branch, so a cache saved by a PR run lives on refs/pull/N/merge and no other
# run can ever see it. Without a main-branch run there is no shared cache, and
# every packaging job re-downloads ~100MB of Electron dists — including the
# release build, which is where that hurts most.
#
# Both halves carry the same paths filter, so merges that touch nothing
# packaging-related still cost nothing, and the cache is refreshed exactly when
# its key (the lockfile hash) could have changed.
#
# A cheaper `dist:dir` on every PR was considered and rejected — it costs an
# Electron download to prove only what `build` and `smoke` already prove, and
# never touches Wine, NSIS or the hicolor icon set, which is where every
# packaging failure in CLAUDE.md actually happened.
#
# Do NOT make this a required status check. It is paths-filtered, and a skipped
# check never reports, which would block every unrelated PR forever.
name: Package

# Kept in step by hand: GitHub's workflow parser does not support YAML anchors,
# so the two lists cannot be shared.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron-builder.yml'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'scripts/smoke-mac.mjs'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'electron-builder.yml'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      # The build runs *inside* these. A changed base image or compose service
      # can break packaging without touching a single file electron-builder
      # reads, so they belong here as much as the config does.
      - 'docker-compose.yml'
      - 'docker/**'
      - 'scripts/smoke-mac.mjs'
      - '.github/workflows/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package-linux-windows
    runs-on: ubuntu-latest
    env:
      CACHE_ENV: >-
        -e npm_config_cache=/project/.cache/npm
        -e ELECTRON_CACHE=/project/.cache/electron
        -e ELECTRON_BUILDER_CACHE=/project/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: .cache
          # Separate namespace from the smoke job's — see the note in ci.yml.
          key: dmscreen-package-${{ hashFiles('package-lock.json') }}
          restore-keys: dmscreen-package-

      # Windows targets cross-build through Wine, which is the whole reason this
      # runs in the builder image rather than on the runner.
      - name: Build installers
        run: |
          docker compose run --rm -T $CACHE_ENV build npm ci
          docker compose run --rm -T $CACHE_ENV build npm run dist:all

      # The cache silently degraded to npm-only once, and nothing said so — it
      # took comparing byte counts against setup-node's cache to notice. Printing
      # the contents makes the next regression announce itself instead.
      - name: What actually got cached
        if: always()
        run: du -sh .cache/* 2>/dev/null || echo '.cache is empty — the -e overrides are not landing'

      # Two traps from CLAUDE.md cannot fire here, and it is worth knowing why:
      # the runner's release/ starts empty, so a stale artifact cannot pose as a
      # fresh one, and nothing can be holding the portable exe open.
      - name: Check all four installers exist
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.AppImage release/*.deb)
          printf '%s\n' "${assets[@]}"
          if [ "${#assets[@]}" -ne 4 ]; then
            printf 'expected 4 installers, got %d\n' "${#assets[@]}"
            exit 1
          fi

      # So a PR can be tried by hand rather than only read. Short retention on
      # purpose: these are ~400MB a run and only useful while the PR is open.
      # Releases are built fresh from the tag by release.yml, never from here.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-windows-installers
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  package-mac:
    name: package-macos-arm64
    # The standard macos-15 runner is an Apple-silicon machine. Building on the
    # target architecture avoids the invalid framework symlinks produced by the
    # old Linux cross-build experiment.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and build the ad-hoc signed app
        # electron-builder skips all signing for fork PRs by default, even when
        # identity "-" is explicit. This job uses no signing secrets: opting in
        # only enables the requested local ad-hoc signature.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          npm ci
          npm run dist:mac:adhoc

      - name: Verify signature and artifact
        run: |
          app='release/mac-arm64/Digital DM Screen.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          shopt -s nullglob
          assets=(release/*.dmg)
          printf '%s\n' "${assets[@]}"
          if [ "${#assets[@]}" -ne 1 ]; then
            printf 'expected 1 macOS installer, got %d\n' "${#assets[@]}"
            exit 1
          fi

      # This launches the packaged .app itself, not electron-vite's development
      # binary, so it catches broken signatures and bundle structure too.
      - name: Launch and render the packaged app
        run: npm run smoke:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-installer
          path: release/*.dmg
          if-no-files-found: error
          # Matches the Linux/Windows installers above — big, and only useful
          # while the PR is open. Screenshots keep the default; they are tiny and
          # worth having around to compare against.
          retention-days: 7

      - name: Upload macOS smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-smoke
          path: release/smoke-mac/*.png
          if-no-files-found: error
