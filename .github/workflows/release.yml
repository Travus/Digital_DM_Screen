# Turns a tag into a draft GitHub Release with all platform installers attached.
# Draft, not published: nothing reaches anyone until the notes have been read.
#
# To cut a release:
#
#   docker compose run --rm -T build npm version minor --no-git-tag-version
#   git commit -am "Release v0.3.0"     # then PR, review, merge
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
#
# `npm version` is deliberately run with --no-git-tag-version and the tag applied
# after the merge. Its own tag would point at the pre-merge commit, and a squash
# merge would leave that commit off main entirely — cutting the release from
# something no branch contains.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a half-published release.
  cancel-in-progress: false

jobs:
  mac:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(plutil -extract version raw package.json)"
          lock="v$(plutil -extract version raw package-lock.json)"
          echo "tag=$tag package.json=$pkg package-lock.json=$lock"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$lock" ]; then
            echo "::error::tag $tag does not match package.json ($pkg) / package-lock.json ($lock)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build the ad-hoc signed installer
        run: |
          npm ci
          npm run dist:mac:adhoc

      - name: Verify and launch the packaged app
        run: |
          codesign --verify --deep --strict --verbose=2 'release/mac-arm64/Digital DM Screen.app'
          npm run smoke:mac

      - name: Check the installer exists
        run: |
          shopt -s nullglob
          assets=(release/*.dmg)
          printf '%s\n' "${assets[@]}"
          if [ "${#assets[@]}" -ne 1 ]; then
            printf '::error::expected 1 macOS installer, got %d\n' "${#assets[@]}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: release
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes, and only to create the release.
      contents: write
    env:
      CACHE_ENV: >-
        -e npm_config_cache=/project/.cache/npm
        -e ELECTRON_CACHE=/project/.cache/electron
        -e ELECTRON_BUILDER_CACHE=/project/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # First, before anything expensive. A tag that disagrees with package.json
      # would produce artifacts named after one version and a release named after
      # another, and the mismatch would only surface on someone's download.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(jq -r .version package.json)"
          lock="v$(jq -r .version package-lock.json)"
          echo "tag=$tag package.json=$pkg package-lock.json=$lock"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$lock" ]; then
            echo "::error::tag $tag does not match package.json ($pkg) / package-lock.json ($lock)"
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: .cache
          # Shares the packaging job's namespace deliberately: this job does the
          # same work — smoke, then dist:all — so it wants the same contents, and
          # a third 350MB cache would buy nothing.
          key: dmscreen-package-${{ hashFiles('package-lock.json') }}
          restore-keys: dmscreen-package-

      - name: Install
        run: docker compose run --rm -T $CACHE_ENV build npm ci

      # A release that does not render is the worst kind. ~4 minutes.
      - name: Render check
        run: |
          docker compose build smoke
          docker compose run --rm -T $CACHE_ENV build npm run build
          docker compose run --rm -T smoke

      - name: Build installers
        run: docker compose run --rm -T $CACHE_ENV build npm run dist:all

      # NOT into release/. The compose services run as root, so every file and
      # directory they create in the bind-mounted workspace — release/ included —
      # comes out root-owned and mode 755. This action runs as the `runner` user,
      # which then cannot write there: the download fails instantly, five times,
      # and reports "Artifact download failed after 5 retries", which reads like a
      # network problem and is not.
      #
      # Reading root-owned files is fine, which is why the upload side and the
      # count gate never noticed. Only this step writes.
      - name: Download the macOS installer
        uses: actions/download-artifact@v7
        with:
          name: release-macos-arm64
          path: release-mac

      - name: Collect assets
        run: |
          shopt -s nullglob
          # Filenames contain spaces — "Digital DM Screen-0.3.0-x64-setup.exe" —
          # so the array and "${assets[@]}" are what keeps them one argument each.
          # .blockmap is excluded: it serves electron-updater, which is unused.
          assets=(release/*.exe release/*.AppImage release/*.deb release-mac/*.dmg)
          printf '%s\n' "${assets[@]}"
          # dist:win can produce the NSIS installer and lose the portable one,
          # leaving release/ half fresh. Counting catches that here, where it
          # would not locally: the runner's release/ starts empty.
          if [ "${#assets[@]}" -ne 5 ]; then
            printf '::error::expected 5 installers, got %d\n' "${#assets[@]}"
            exit 1
          fi
          # Hand them to the next step without re-globbing.
          printf '%s\n' "${assets[@]}" > assets.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < assets.txt
          # --verify-tag refuses to invent a tag if the ref is somehow wrong.
          # Re-running after a failure hits "release already exists" — delete the
          # draft first (gh release delete "$GITHUB_REF_NAME" --yes) rather than
          # clobbering, because a silently overwritten draft is worse.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${assets[@]}"
          echo "Draft release created. Review the notes, then publish it."
