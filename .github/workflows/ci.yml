# Gates every PR and every push to main: checks, then rendering, then the
# installers themselves.
#
# Everything here runs natively. The Docker toolchain is the local development
# path — it exists so this project needs no Node on the host — but a runner is
# destroyed when the job ends, so there is nothing to keep clean and no reason
# to pull a 2GB image to do it.
#
# Packaging lives here rather than in a workflow of its own because a render
# check can only gate it from inside the same run: two workflows cannot depend
# on each other, and the alternative was rendering twice per PR. It used to be
# separate and paths-filtered so a ~2GB Wine image was not pulled for a one-line
# change; native builds are cheap enough that the filter bought less than it
# cost. A skipped check never reports, so that filter was also the thing that
# made packaging unrequirable.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  # No base filter, for the same reason there is no paths filter. `branches:` on
  # a pull_request matches the *base*, so pinning it to main means a PR stacked
  # on another branch — the normal way to review a fix that sits on top of a
  # revert — triggers nothing at all, and every required check stays unreported
  # forever. That reads as CI being broken and can only be resolved by bypassing
  # the ruleset. A run against the wrong base costs one build; a check that can
  # never report costs the branch protection.
  pull_request:

permissions:
  contents: read
  # Only so a manual run can ask whether its branch has an open PR, and name the
  # artifacts after it. Nothing here writes.
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        # Linting has no use for a 100MB Electron binary; the package's types
        # still install, which is all typecheck needs.
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # Run separately rather than via `npm run check`, so a failure names itself
      # in the job log without anyone opening it.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  smoke:
    name: smoke
    uses: ./.github/workflows/render-check.yml

  # Resolved once, here, rather than in each of the three build jobs.
  resolve-pr:
    name: resolve-pr
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.number }}
        run: bash ./scripts/resolve-pr.sh

  build:
    name: build
    # Rendering gates packaging: there is no point producing installers of a
    # build that does not draw.
    needs: [check, smoke, resolve-pr]
    uses: ./.github/workflows/build-installers.yml
    with:
      label: ${{ needs.resolve-pr.outputs.number }}
      # Big, and only useful while the PR is open. Releases build fresh from the
      # tag rather than reaching for these.
      retention-days: 7
