version: 2

updates:
  # Nothing in the repo pins or references an action version, so a stale one
  # never fails a build — it surfaces as a deprecation warning in a log nobody
  # opens. Monthly is plenty: actions move slowly, and a stale one is a warning
  # long before it is an outage.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The toolchain image is pinned, and a pin nobody watches rots the same way the
  # actions did. These are two separate ecosystems: `docker` reads Dockerfiles
  # (matched on the filename containing "dockerfile", so smoke.Dockerfile counts),
  # `docker-compose` reads the `image:` keys in compose files. One would miss half
  # the pin and let the two drift apart.
  - package-ecosystem: docker
    directory: '/docker'
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      # One PR for the routine churn. Majors stay individual so they get read
      # rather than skimmed as part of a batch.
      minor-and-patch:
        update-types: [minor, patch]

    # Majors of these are held deliberately — see //pinned in package.json for
    # the reason behind each. Everything else must still open a PR, Electron
    # above all: it ships Chromium to the user, so an out-of-support Electron
    # means shipping unpatched browser CVEs.
    #
    # Note these are ceilings, not freezes: the caret ranges in package.json
    # still take patch and minor releases. What they do not do is arrive on
    # their own — `npm ci` installs the lockfile verbatim, so a range picks a
    # release up only when something rewrites that lockfile. For a direct
    # dependency that is the grouped pull request above. For a transitive one
    # nothing here reaches it at all, which is what security-refresh.yml is
    # for: version updates read package.json, and security updates need an
    # alert that development-scoped packages do not reliably get.
    ignore:
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zustand'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # React and its three travelling companions move together or not at all —
      # a react-dom@19 PR against react@18 is noise, not an upgrade.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
